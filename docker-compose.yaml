version: "3.8"

x-airflow-common: &airflow-common
  build:
    context: ./docker/airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__WEBSERVER__SECRET_KEY: "super-rahasia-agustibayu-abs-123"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins    
    - ./scripts:/opt/airflow/scripts
    - /var/run/docker.sock:/var/run/docker.sock
  user: "50000:0"
  networks:
    - spark-net
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:  
  postgres:
    image: postgres:13
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    container_name: postgres
    ports:
    - "5432:5432"
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 5
    networks:
      - spark-net

  redis:
    image: redis:7.0
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spark-net

  # Airflow Services
  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin
      --firstname Admin --lastname User
      --role Admin --email admin@example.com"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  airflow-worker:
    <<: *airflow-common
    command: celery worker

  # Spark
  spark-master:
    build:
      context: ./docker/spark
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MODE=master
      # SUDAH BERSIH: Driver Kafka dihapus dari environment parameter Spark
      - SPARK_SUBMIT_PARAMETERS=--packages org.apache.hadoop:hadoop-aws:3.3.4
    ports:
      - "7077:7077"
      - "8081:8080"
      - "10000:10000"
    volumes:
      - ./scripts:/opt/spark/scripts
      - spark-ivy-cache:/opt/spark/.ivy
    networks:
      - spark-net

  spark-worker:
    build:
      context: ./docker/spark
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_MODE=worker
      # SUDAH BERSIH: Driver Kafka dihapus dari environment parameter Spark
      - SPARK_SUBMIT_PARAMETERS=--packages org.apache.hadoop:hadoop-aws:3.3.4
    depends_on:
      - spark-master
    networks:
      - spark-net
    deploy:
      resources:
        limits:
          memory: 1G
  
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - spark-net

  trino:
    image: trinodb/trino:435
    container_name: trino
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    ports:
      - "8088:8080"   # beda dari Airflow 8080
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - trino-data:/data
    depends_on:
      - minio
    networks:
      - spark-net

  metabase:
    image: metabase/metabase:v0.56.4
    container_name: metabase
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    ports:
      - "8082:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=db_resepsi_metabase
      - MB_DB_PORT=5432
      - MB_DB_USER=airflow
      - MB_DB_PASS=airflow
      - MB_DB_HOST=postgres
      - JAVA_OPTS=-Xmx768m -Xms512m
    networks:
      - spark-net
    restart: always

networks:
  spark-net:
    driver: bridge

volumes:
  postgres-db-volume:
  minio-data:  
  spark-ivy-cache:
  trino-data: